<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #f627ff;
      font-family: 'VT323', monospace;
      font-size: 22px;
    }

    h1 {
      margin: 0 0 20px;
      text-align: center;
      letter-spacing: 2px;
    }

    /* 4 colonne con layout tipo collage */
    .grid {
      column-count: 4;
      column-gap: 20px;
      padding: 20px;
    }

    .grid-item {
      display: inline-block;
      width: 100%;
      margin-bottom: 20px;
      cursor: pointer;
      overflow: hidden;
      border-radius: 4px;

      /* altezza variabile */
      height: auto;
    }

    .grid-item img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .grid-item:hover img {
      transform: scale(1.05);
      opacity: 0.85;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
    }

    .lightbox-content img {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    .lightbox-close {
      position: absolute;
      top: -35px;
      right: 0;
      font-size: 26px;
      cursor: pointer;
      color: #f627ff;
    }
  </style>
</head>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-content">
      <span class="lightbox-close" id="lightboxClose">[ chiudi ]</span>
      <img id="lightboxImg" src="">
    </div>
  </div>

  <script>
    const items = document.querySelectorAll('.grid-item img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const closeBtn = document.getElementById('lightboxClose');

    items.forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.classList.add('active');
      });
    });

    closeBtn.addEventListener('click', () => {
      lightbox.classList.remove('active');
    });

    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) lightbox.classList.remove('active');
    });
  </script>
